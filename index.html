  <body>
    <canvas id="bg"></canvas>

    <!-- Intro Text -->
    <div id="introText">
      <div id="introNameWrap">
        <img id="logoFade" src="/AGLogo.png" alt="AG Logo" />
        <span id="namePrefix">I am</span>
        <span id="nameTitle">Anurag Gotety</span>

      <p2 style="font-style: italic; opacity: 0.8;">Click any object to begin.</p2>

    <div id="infoToggle">&#9776;</div>

    <!-- Social Panel -->
    <div id="infoPanelMini">

        <a href="mailto:anurag10gotety@gmail.com"><i class="fas fa-envelope"></i></a>

        <a href="https://www.instagram.com/goat80_productions/" target="_blank"><i class="fab fa-instagram"></i></a>
      </div>
      <button id="downloadResumeBtn" class="resume-link">Download Resume</button>
    </div>

    <div id="loadingSpinner">
      <div class="spinner"></div>
      <p>Loading 3D assets...</p>
    </div>

    <!-- Info Panel for clicked project -->
    <div id="infoPanel">
      <button id="closePanelBtn">← Close</button>
      <h2 id="panelTitle">Project</h2>
      <div class="panel-buttons">
        <button id="seeMoreBtn">See More</button>
        <button id="playGameBtn">Play Game</button>
      </div>
      <p id="panelSubtitle">Short description line.</p>
      <img id="panelImage" src="" alt="Project image" />
      <p id="panelDescription">Longer paragraph about the project...</p>
    </div>

    <script type="module" src="/src/main.js"></script>
    <button id="resetCameraBtn" class="reset-camera">Reset Camera</button>
