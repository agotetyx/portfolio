<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/AGLogo.png" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anurag Gotety Portfolio</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="/style.css" />
    <!-- Font Awesome for social icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>

    <canvas id="bg"></canvas>

    <!-- Intro Text (centred on the scene) -->
<div id="introText">
  <div id="introNameWrap">
    <span id="namePrefix">I am</span>
    <span id="nameTitle">Anurag Gotety</span>
  </div>
  <p>Welcome to my universe</p>
</div>
<div id="clickHint">Click any object to begin</div>


<div id="loadingSpinner">
  <div class="spinner"></div>
  <p>Loading 3D assets...</p>
</div>

    <!-- Info Panel for clicked project / About -->
    <aside id="infoPanel" role="dialog" aria-label="About" aria-hidden="true">
      <div class="ip-head">
        <div>
          <div id="panelEyebrow" class="ip-eyebrow">About</div>
          <h2 id="panelTitle">Project</h2>
        </div>
        <button id="closePanelBtn" class="ip-close" aria-label="Close panel">✕</button>
      </div>
      <div class="ip-actions">
        <button id="panelPrimaryBtn" class="ip-primary"></button>
        <button id="panelSecondaryBtn" class="ip-secondary"></button>
      </div>
      <a id="panelResumeLink" class="ip-link" href="/resume/AnuragGotety_resume.pdf" target="_blank" rel="noopener">View in new tab ↗</a>
      <p id="panelSubtitle">Short description line.</p>
      <img id="panelImage" src="" alt="Project image" />
      <video id="panelVideo" autoplay muted loop playsinline style="display:none"></video>
      <div id="panelDescription">Longer paragraph about the project...</div>
    </aside>

    <script type="module" src="/src/main.js"></script>
<!-- Chat Toggle Button -->
<div id="chatToggleBtn">
<img src="/images/ai-sparkle-logo.png" alt="AI Chat" id="chatIcon" />
</div>
<div id="chatTooltip">Learn more about me!</div>

<!-- Chatbot Overlay -->
<div id="chatOverlay">
  <div id="chatHeader">
    Ask Me Anything about Anurag
    <span id="chatCloseBtn">×</span>
  </div>
  <div id="chatLog"></div>
  <div id="chatInputWrap">
  <input type="text" id="chatInput" placeholder="Ask me anything..." />
  <button id="chatSendBtn">➤</button>
</div>

</div>

  </body>
</html>
